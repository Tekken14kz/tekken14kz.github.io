<div class="app">
  <div class="topbar" id="topbar"></div>

  <aside class="rail" id="rail">
    <div class="rail-head">
      <p class="brand-count">{{COUNT}}</p>
      <h1 class="brand"><a href="{{HOME}}" id="homeLink">{{TITLE}}</a></h1>
      <input class="search" id="search" type="search" placeholder="Найти заметку  /" aria-label="Поиск по заметкам">
      <div class="filters" id="filters">{{FILTERS}}</div>
    </div>

    <div class="rail-list" id="railList">{{RAILLIST}}</div>

    <div class="rail-controls">
      <button class="txt-btn" id="mapBtn" title="Карта сада (m)">Карта сада</button>
      <button class="txt-btn" id="themeBtn">Тема: <span class="val">как в системе</span></button>
    </div>
    <div class="rail-foot">{{FOOT}}</div>
  </aside>

  <main class="stack" id="stack">{{STACK}}</main>
</div>

<div class="map" id="map" hidden>
  <div class="map-panel" role="dialog" aria-modal="true" aria-label="Карта сада">
    <div class="map-head">
      <h2>Карта сада</h2>
      <span class="map-hint">размер — сколько ссылок ведёт сюда</span>
      <button class="txt-btn" id="mapClose">Закрыть</button>
    </div>
    <div class="map-body" id="mapBody"></div>
    <div class="map-legend">
      <span><span class="mark s-seed"></span>росток</span>
      <span><span class="mark s-grow"></span>растёт</span>
      <span><span class="mark s-ever"></span>вечнозелёная</span>
      <span>наведи на узел — подсветятся соседи, клик открывает заметку</span>
    </div>
  </div>
</div>
